# -----------------------------
# Terminal & interface
# -----------------------------
set -g default-terminal "xterm-256color"
set -g status off

# -----------------------------
# Mouse
# -----------------------------
# Wheel scrolls panes, click selects and resizes panes
set -g mouse on

# Middle click pastes the X primary selection, like outside tmux
bind -n MouseDown2Pane run -b "xsel -o -p | tmux load-buffer - && tmux paste-buffer -p"

# Selecting text with the mouse (drag, double-click word, triple-click line) copies it to the X
# primary selection and clipboard
set -s copy-command "xsel -i -p && xsel -o -p | xsel -i -b"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# Double-click word boundaries: blanks, quotes, brackets and common punctuation (but not . / - _
# so that file names and paths stay whole); trailing . ! ? are stripped from the copied word
set -g word-separators " \"'`()[]{}<>,;:=|"
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
  send -M
} {
  copy-mode -H
  send -X select-word
  run -d0.3
  send -X copy-pipe-and-cancel "sed 's/[.!?]*\$//' | xsel -i -p && xsel -o -p | xsel -i -b"
}
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run -d0.3 \; \
  send -X copy-pipe-and-cancel "sed 's/[.!?]*\$//' | xsel -i -p && xsel -o -p | xsel -i -b"

# Shift+PageUp scrolls back without the prefix; scrolling past the bottom exits copy mode
bind -n S-PageUp copy-mode -eu

# -----------------------------
# Pane splitting (keep cwd)
# -----------------------------
bind | split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# -----------------------------
# Pane navigation (no prefix)
# -----------------------------
bind -n C-Left  select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up    select-pane -U
bind -n C-Down  select-pane -D
bind -n C-p     select-pane -l  # toggle last pane

# -----------------------------
# Copy mode
# -----------------------------
setw -g mode-keys vi

# -----------------------------
# Optional: long scrollback
# -----------------------------
set -g history-limit 100000
