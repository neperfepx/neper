# Variants for local Windows builds (rattler-build build -r conda/recipe
# -m conda/recipe/variants-win.yaml -c conda-forge), as conda-forge's
# pinning (conda-forge-pinning) gives them: not to be submitted to
# conda-forge.
m2w64_c_compiler:
  - gcc
m2w64_c_compiler_version:
  - "15"
m2w64_cxx_compiler:
  - gxx
m2w64_cxx_compiler_version:
  - "15"
m2w64_c_stdlib:
  - m2w64-sysroot
m2w64_c_stdlib_version:
  - "12"
