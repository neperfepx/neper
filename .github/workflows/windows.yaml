name: Build Neper executable on Windows for x86_64

on:
  workflow_call:

jobs:
  build:
    name: Build Neper executable on Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # (some source paths are longer than the 260 characters of Windows'
      # default limit; files checked out as in the repository, without \r\n
      # line ends, as the tests compare them with the references)
      - name: Enable long paths and keep line ends
        shell: pwsh
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install MinGW-w64 GCC (with OpenMP) and CMake
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libgomp
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            curl
            unzip

      # (the Gmsh SDK for Windows: headers, DLL and import library)
      - name: Install Gmsh
        run: |
          curl -sSfL -o gmsh-sdk.zip https://gmsh.info/bin/Windows/gmsh-4.15.0-Windows64-sdk.zip
          unzip -q gmsh-sdk.zip
          mv gmsh-4.15.0-Windows64-sdk gmsh-sdk

      # (no Scotch, not ported to Windows; built-in GSL; tests in Minimal
      # mode, as the meshes of the Gmsh build for Windows differ from the
      # references)
      - name: Generate the build files
        run: |
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DHAVE_LIBSCOTCH=OFF -DFORCE_BUILTIN_GSL=ON \
            -DGMSH_INCLUDE_DIR=$PWD/gmsh-sdk/include \
            -DGMSH_LIBRARY=$PWD/gmsh-sdk/lib/gmsh.dll.lib \
            -DBUILD_TESTING_MODE=Minimal

      - name: Show the configure log
        if: failure()
        run: cat build/CMakeFiles/CMakeConfigureLog.yaml

      - name: Build Neper executable
        run: cmake --build build

      # (the DLLs needed by neper.exe, next to it: Gmsh's and the MinGW-w64
      # runtime)
      - name: Gather the DLLs
        run: |
          cp gmsh-sdk/lib/gmsh-*.dll build/
          for dll in $(ldd build/neper.exe | awk '/\/mingw64\// {print $3}'); do
            cp "$dll" build/
          done
          ls build/*.dll

      - name: Run tests
        continue-on-error: true
        working-directory: build
        env:
          OMP_NUM_THREADS: 2
          NEPER_DATA_DIR: ${{ github.workspace }}/src/data
        run: ctest --output-on-failure

      # (an installed tree: bin, with neper.exe, orilib.exe and the DLLs, and
      # share/neper, with the data files, found by neper.exe next to bin)
      - name: Install Neper
        run: |
          cmake --install build --prefix neper-windows
          cp build/*.dll neper-windows/bin/
          neper-windows/bin/neper.exe --data

      - name: Upload Neper executable
        uses: actions/upload-artifact@v7
        with:
          name: neper-windows-x86_64
          path: neper-windows
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

  # (the conda package for Windows, built and tested with rattler-build from
  # conda/recipe, with conda-forge's MinGW-w64 compilers and Gmsh)
  conda:
    name: Build the conda package on Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Enable long paths and keep line ends
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name LongPathsEnabled -Value 1 -PropertyType DWORD -Force

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rattler-build
        run: |
          Invoke-WebRequest -OutFile rattler-build.exe `
            https://github.com/prefix-dev/rattler-build/releases/latest/download/rattler-build-x86_64-pc-windows-msvc.exe
          .\rattler-build.exe --version

      # (output in a short directory, as the source paths are long)
      - name: Build and test the conda package
        run: |
          .\rattler-build.exe build -r conda/recipe -m conda/recipe/variants-win.yaml `
            -c conda-forge --output-dir D:\o

      - name: Upload the conda package
        uses: actions/upload-artifact@v7
        with:
          name: neper-conda-win-64
          path: D:\o\win-64\*.conda
          retention-days: ${{ github.event.repository.private && 1 || 7 }}
