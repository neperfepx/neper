name: Build the HTML documentation

on:
  workflow_call:

jobs:
  build-website:
    name: Build the documentation with Sphinx
    runs-on: ubuntu-latest
    steps:
      - name: Update apt-get
        run: sudo apt-get update

      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pip
        run: python -m pip install --upgrade pip

      - name: Install Sphinx
        run: pip install "sphinx<8"

      - name: Install the Sphinx theme
        run: pip install pydata-sphinx-theme==0.17.1

      - name: Build the documentation
        working-directory: doc
        run: make html

      - name: Upload the documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: doc/build/html
          retention-days: ${{ github.event.repository.private && 1 || 7 }}

      # (the developer documentation, dev/, is on devel only, not on main)
      - name: Build the developer documentation
        if: hashFiles('dev/conf.py') != ''
        working-directory: dev
        run: make html

      - name: Upload the developer documentation
        if: hashFiles('dev/conf.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: developer-documentation
          path: dev/build/html
          retention-days: ${{ github.event.repository.private && 1 || 7 }}
